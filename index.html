<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ColectoraGPS Pro</title>
    <style>
        :root {
            --bg-color: #e0e5e5;
            --panel-bg: #f0f4f4;
            --primary-text: #2c3e50;
            --accent-green: #27ae60;
            --accent-red: #c0392b;
            --border-color: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary-text);
            font-variant-numeric: tabular-nums;
        }

        .status-badge {
            display: block;
            text-align: center;
            background-color: var(--border-color);
            color: white;
            padding: 8px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .status-badge.active {
            background-color: var(--accent-green);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .data-table td {
            padding: 10px 5px;
            border-bottom: 1px dashed var(--border-color);
            font-size: 16px;
        }

        .data-table td:nth-child(2) {
            text-align: right;
            font-family: monospace;
            font-size: 18px;
            color: #2980b9;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--border-color);
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-start { background-color: var(--accent-green); }
        .btn-stop { background-color: var(--accent-red); }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <label>Identificador del Punto / Trayectoria:</label>
        <input type="text" id="puntoId" value="Despejado">
    </div>
    <div class="input-group">
        <label>Modo de Medición:</label>
        <select id="modoFiltro">
            <option value="estatico">Estático (Filtro Espacial Activado)</option>
            <option value="cinematico">Cinemático (Raw)</option>
        </select>
    </div>

    <div class="header" id="tiempoTranscurrido">00:00</div>
    <div class="status-badge" id="statusBadge">ESPERANDO INICIO...</div>

    <table class="data-table">
        <tr>
            <td>Norte (Y Vivo):</td>
            <td id="valNorte">---</td>
        </tr>
        <tr>
            <td>Este (X Vivo):</td>
            <td id="valEste">---</td>
        </tr>
        <tr>
            <td>Cota (Z Vivo):</td>
            <td id="valCota">--- m</td>
        </tr>
        <tr>
            <td>Precisión GPS (H):</td>
            <td id="valPrecision">--- m</td>
        </tr>
        <tr>
            <td>Satélites (Uso/Vis):</td>
            <td id="valSatelites">-- / --</td>
        </tr>
        <tr>
            <td>Épocas Grabadas:</td>
            <td id="valEpocas">0</td>
        </tr>
    </table>

    <button class="btn btn-start" id="btnIniciar" onclick="iniciarLevantamiento()">INICIAR LEVANTAMIENTO</button>
    <button class="btn btn-stop" id="btnDetener" onclick="detenerLevantamiento()" style="display:none;">DETENER LEVANTAMIENTO</button>
</div>

<script>
    // Variables de Estado y Modelo Matemático
    let watchId = null;
    let timerId = null;
    let tiempoSegundos = 0;
    let epocasGrabadas = 0;
    let satelitesEnUso = 0;
    let satelitesVisibles = 0;

    // Filtro de Promedio Móvil (Espacial)
    let sumNorte = 0, sumEste = 0, sumCota = 0;

    function formatearTiempo(segundos) {
        const m = Math.floor(segundos / 60).toString().padStart(2, '0');
        const s = (segundos % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function iniciarLevantamiento() {
        if (!navigator.geolocation) {
            alert("Su navegador no soporta geolocalización.");
            return;
        }

        // Reinicio de variables
        tiempoSegundos = 0;
        epocasGrabadas = 0;
        sumNorte = 0; sumEste = 0; sumCota = 0;
        
        document.getElementById('tiempoTranscurrido').innerText = "00:00";
        document.getElementById('valEpocas').innerText = "0";
        document.getElementById('btnIniciar').style.display = 'none';
        document.getElementById('btnDetener').style.display = 'block';
        
        const badge = document.getElementById('statusBadge');
        badge.innerText = "ENGANCHANDO CONSTELACIÓN...";
        badge.classList.remove('active');

        // Iniciar Cronómetro
        timerId = setInterval(() => {
            tiempoSegundos++;
            document.getElementById('tiempoTranscurrido').innerText = formatearTiempo(tiempoSegundos);
        }, 1000);

        // Iniciar captura GPS de alta precisión
        watchId = navigator.geolocation.watchPosition(procesarPosicion, manejarError, {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 5000
        });
    }

    function detenerLevantamiento() {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (timerId !== null) clearInterval(timerId);
        
        document.getElementById('btnIniciar').style.display = 'block';
        document.getElementById('btnDetener').style.display = 'none';
        
        const badge = document.getElementById('statusBadge');
        badge.innerText = "SISTEMA DETENIDO";
        badge.classList.remove('active');
        badge.style.backgroundColor = "#7f8c8d";
    }

    function procesarPosicion(position) {
        // Validación de señal
        if (position.coords.accuracy > 50) return; // Descartar épocas con error > 50m

        epocasGrabadas++;
        
        // Actualizar UI Badge
        const badge = document.getElementById('statusBadge');
        badge.innerText = `GRABANDO (Precisión: ±${position.coords.accuracy.toFixed(1)}m)`;
        badge.classList.add('active');

        // LÓGICA DE APROXIMACIÓN (LAT/LON a Pseudocoordenadas Planas para visualización)
        // Nota: Para topografía geodésica real, utilice la librería Proj4js aquí.
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        
        // Extracción de Cota (Altitud). Si el chip no reporta, asume 0 para no quebrar la matemática
        const cotaRaw = position.coords.altitude !== null ? position.coords.altitude : 0.0;

        // MODELO MATEMÁTICO: Filtro Espacial Activado (Promedio Simple Acumulativo)
        const modoFiltro = document.getElementById('modoFiltro').value;
        let cotaFinal, norteFinal, esteFinal;

        if (modoFiltro === "estatico") {
            sumNorte += lat; // Acumulador Y
            sumEste += lon;  // Acumulador X
            sumCota += cotaRaw; // Acumulador Z (Soluciona el error de congelamiento)

            norteFinal = (sumNorte / epocasGrabadas) * 111320; // Conversión métrica aproximada
            esteFinal = (sumEste / epocasGrabadas) * 111320 * Math.cos(lat * Math.PI / 180);
            cotaFinal = sumCota / epocasGrabadas;
        } else {
            // Modo Cinemático (Sin filtro, lectura cruda)
            norteFinal = lat * 111320;
            esteFinal = lon * 111320 * Math.cos(lat * Math.PI / 180);
            cotaFinal = cotaRaw;
        }

        // Renderizado en Pantalla
        document.getElementById('valNorte').innerText = norteFinal.toFixed(4);
        document.getElementById('valEste').innerText = esteFinal.toFixed(4);
        
        // Corrección de visualización de la Cota
        document.getElementById('valCota').innerText = (cotaFinal !== 0) ? cotaFinal.toFixed(4) + " m" : "Sin Datos Z";
        document.getElementById('valPrecision').innerText = "±" + position.coords.accuracy.toFixed(2) + " m";
        document.getElementById('valEpocas').innerText = epocasGrabadas;
    }

    function manejarError(error) {
        console.warn('ERROR(' + error.code + '): ' + error.message);
    }

    /* * ==========================================
     * PUENTE DE COMUNICACIÓN ANDROID -> JAVASCRIPT
     * ==========================================
     * Esta función debe ser invocada desde el código Java/Kotlin del WebView
     * Ejemplo en Android: webView.evaluateJavascript("actualizarSatelitesDesdeAndroid(8, 12);", null);
     */
    function actualizarSatelitesDesdeAndroid(enUso, visibles) {
        satelitesEnUso = enUso;
        satelitesVisibles = visibles;
        document.getElementById('valSatelites').innerText = `${satelitesEnUso} / ${satelitesVisibles}`;
    }
</script>

</body>
</html>
